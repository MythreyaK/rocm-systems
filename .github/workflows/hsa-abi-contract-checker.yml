name: HSA ABI Contract Checker

permissions:
  contents: read

# This workflow ensures that HSA runtime (ROCR) maintains ABI contract compliance
# with ROCProfiler-SDK. It checks that new APIs are properly tracked and 
# deprecated APIs follow the proper deprecation process.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/rocr-runtime/**'
      - '!projects/rocr-runtime/*.md'
      - '!projects/rocr-runtime/**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hsa-abi-contract-check:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        # Need full history to compare changes
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Run HSA ABI Contract Check
      run: |
        python3 .github/scripts/abi_contract_checker.py \
          --repo-root . \
          --check-hsa \
          --verbose

    - name: Check for API changes in PR
      if: github.event_name == 'pull_request'
      run: |
        echo "🔍 Checking for HSA API changes in this PR..."
        
        # Get list of changed files
        git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD > changed_files.txt
        
        # Check if any HSA API-related files were modified
        if grep -q -E "(hsa.*\.h|hsa.*\.hpp|hsa_ext)" changed_files.txt; then
          echo "⚠️ HSA API-related files were modified in this PR:"
          grep -E "(hsa.*\.h|hsa.*\.hpp|hsa_ext)" changed_files.txt || true
          echo ""
          echo "📋 Please ensure that:"
          echo "1. New HSA APIs are properly added to rocprofiler-sdk"
          echo "2. Deprecated APIs are marked correctly"
          echo "3. ABI compatibility is maintained"
          echo "4. Version numbers are updated appropriately"
        else
          echo "✅ No HSA API-related files were modified in this PR"
        fi